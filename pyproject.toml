[project]
name = "job-applier"
version = "0.1.0"
description = "Local daily job search, resume tailoring and assisted applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "keyring>=25.0",
    "anthropic>=0.70",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
jobapplier = "job_applier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_applier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
